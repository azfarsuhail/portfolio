<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Off-black tile with a 1px #222226 edge, inset half a pixel so the stroke stays crisp. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="#050505" stroke="#222226"/>
  <!-- The wiring: three square nodes, Ice White edges, the apex lit Electric Blue. -->
  <path d="M8 23 16 9 24 23Z" fill="none" stroke="#F4F5F6" stroke-width="2" stroke-linejoin="round"/>
  <rect x="6" y="21" width="4" height="4" fill="#F4F5F6"/>
  <rect x="22" y="21" width="4" height="4" fill="#F4F5F6"/>
  <rect x="13" y="6" width="6" height="6" fill="#0066FF"/>
</svg>
